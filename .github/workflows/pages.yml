name: Validate and deploy ShiftBridge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:ui
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy static workspace
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for asset in '' css/styles.css js/app.js js/core.js data/demo.json version.json; do
            curl --fail --retry 4 --retry-delay 5 "${SITE_URL}${asset}" --output /dev/null
          done
